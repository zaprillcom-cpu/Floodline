# FalkorDB 6.x (:latest) does not ship algo.AStar or CCH yet.
# Floodline pins the C-engine image that does. Do not retag this to :latest.
services:
  falkordb:
    image: falkordb/falkordb:v4.22.0
    container_name: floodline-falkordb
    # The image default TIMEOUT is 1000 ms. CCH build and city-scale queries need longer.
    # RESULTSET_SIZE default (10000) is tight once the Valencia drive graph is loaded.
    environment:
      FALKORDB_ARGS: ${FALKORDB_ARGS:-TIMEOUT 120000 RESULTSET_SIZE 1000000}
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  falkordb_data:
